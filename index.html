<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaktionsspiel</title>

  <!-- ===== AUSSEHEN (CSS) =====
       Hier kannst du Farben, Schriftgrößen und Abstände ändern. -->
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #1e2a3a;      /* Hintergrundfarbe der Seite */
      color: white;             /* Textfarbe */
      text-align: center;
      padding: 16px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 10px 0 4px;
    }

    .untertitel {
      color: #b8c4d4;
      margin: 0 0 20px;
    }

    /* Das große Feld, auf das man klickt */
    #spielfeld {
      max-width: 600px;
      height: 320px;
      margin: 0 auto;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.1s;
      padding: 16px;
    }

    #grosserText {
      font-size: 2.4rem;
      font-weight: bold;
      margin: 0;
    }

    #kleinerText {
      font-size: 1.1rem;
      margin: 10px 0 0;
    }

    /* Die verschiedenen Farben des Spielfelds */
    .start  { background: #3b6fd8; }   /* blau  = bereit       */
    .warten { background: #d83b3b; }   /* rot   = warten!      */
    .jetzt  { background: #2fbf4a; }   /* grün  = JETZT klicken */
    .fehler { background: #e08a1e; }   /* orange = zu früh     */

    /* Kasten für Bestzeit und letzte Zeiten */
    .punkte {
      max-width: 600px;
      margin: 20px auto 0;
      display: flex;
      gap: 12px;
    }

    .kasten {
      flex: 1;
      background: #2b3b50;
      border-radius: 16px;
      padding: 12px;
    }

    .kasten h2 {
      font-size: 1rem;
      color: #b8c4d4;
      margin: 0 0 6px;
    }

    #bestzeit {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffd84a;
    }

    #liste {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 1.1rem;
    }

    .hinweis {
      color: #8899aa;
      font-size: 0.9rem;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- ===== INHALT (HTML) =====
       Hier stehen die Texte, die man auf der Seite sieht. -->
  <h1>⚡ Reaktionsspiel ⚡</h1>
  <p class="untertitel">Wie schnell bist du wirklich?</p>

  <div id="spielfeld" class="start">
    <p id="grosserText">Klick zum Starten</p>
    <p id="kleinerText">Warte, bis das Feld GRÜN wird, dann klick so schnell du kannst!</p>
  </div>

  <div class="punkte">
    <div class="kasten">
      <h2>🏆 Bestzeit</h2>
      <div id="bestzeit">–</div>
    </div>
    <div class="kasten">
      <h2>Letzte Versuche</h2>
      <ul id="liste"><li>–</li></ul>
    </div>
  </div>

  <p class="hinweis">Tipp: Am Computer kannst du auch die Leertaste drücken.</p>


  <!-- ===== LOGIK (JavaScript) =====
       Hier steht, was passiert, wenn man klickt. -->
  <script>
    // Die Teile der Seite, die wir verändern wollen
    const spielfeld   = document.getElementById("spielfeld");
    const grosserText = document.getElementById("grosserText");
    const kleinerText = document.getElementById("kleinerText");
    const bestzeitAnzeige = document.getElementById("bestzeit");
    const liste = document.getElementById("liste");

    // Der Zustand des Spiels: "start", "warten", "jetzt" oder "fehler"
    let zustand = "start";
    let startZeit = 0;      // wann das Feld grün wurde
    let timer = null;       // der Countdown bis grün
    let letzteZeiten = [];  // die letzten Ergebnisse
    let bestzeit = null;

    // Bestzeit aus dem Browser-Speicher laden (falls vorhanden)
    try {
      const gespeichert = localStorage.getItem("bestzeit");
      if (gespeichert) {
        bestzeit = Number(gespeichert);
        bestzeitAnzeige.textContent = bestzeit + " ms";
      }
    } catch (e) { /* Speicher nicht verfügbar – egal */ }

    // Ändert Farbe und Texte des Spielfelds
    function zeige(neuerZustand, gross, klein) {
      zustand = neuerZustand;
      spielfeld.className = neuerZustand;
      grosserText.textContent = gross;
      kleinerText.textContent = klein;
    }

    // Eine Bewertung, je nachdem wie schnell man war
    function bewertung(ms) {
      if (ms < 200) return "🚀 Blitzschnell! Bist du ein Roboter?";
      if (ms < 250) return "🔥 Super schnell!";
      if (ms < 300) return "😎 Richtig gut!";
      if (ms < 400) return "👍 Nicht schlecht!";
      return "🐢 Das geht noch schneller!";
    }

    // Wird bei jedem Klick (oder Leertaste) aufgerufen
    function klick() {
      if (zustand === "start" || zustand === "fehler") {
        // Runde starten: rot werden und zufällig lange warten
        zeige("warten", "Warte …", "Noch nicht klicken!");
        const warteZeit = 1500 + Math.random() * 3000; // 1,5 bis 4,5 Sekunden
        timer = setTimeout(function () {
          zeige("jetzt", "JETZT!", "Klick!");
          startZeit = performance.now();
        }, warteZeit);
      }
      else if (zustand === "warten") {
        // Zu früh geklickt!
        clearTimeout(timer);
        zeige("fehler", "Zu früh! 😅", "Klick, um es nochmal zu probieren.");
      }
      else if (zustand === "jetzt") {
        // Reaktionszeit messen
        const ms = Math.round(performance.now() - startZeit);
        zeige("start", ms + " ms", bewertung(ms) + " Klick für die nächste Runde.");
        neuesErgebnis(ms);
      }
    }

    // Speichert ein Ergebnis und aktualisiert die Anzeige
    function neuesErgebnis(ms) {
      letzteZeiten.unshift(ms);                 // vorne einfügen
      letzteZeiten = letzteZeiten.slice(0, 5);  // nur die letzten 5 behalten

      liste.innerHTML = "";
      for (const zeit of letzteZeiten) {
        const eintrag = document.createElement("li");
        eintrag.textContent = zeit + " ms";
        liste.appendChild(eintrag);
      }

      if (bestzeit === null || ms < bestzeit) {
        bestzeit = ms;
        bestzeitAnzeige.textContent = ms + " ms";
        grosserText.textContent = ms + " ms 🏆";
        kleinerText.textContent = "NEUE BESTZEIT! Klick für die nächste Runde.";
        try { localStorage.setItem("bestzeit", ms); } catch (e) {}
      }
    }

    // Klick mit Maus oder Finger
    spielfeld.addEventListener("pointerdown", klick);

    // Leertaste auf der Tastatur
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space") {
        e.preventDefault();
        if (!e.repeat) klick();
      }
    });
  </script>

</body>
</html>
